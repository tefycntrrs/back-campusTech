spring.application.name=ecommerce-group1
server.port=8081

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# --- Seguridad / JWT ---
# La clave firma los tokens: si cambia, todos los tokens emitidos dejan de valer.
# En produccion se pasa por variable de entorno; el valor de abajo es solo para desarrollo.
# Tiene que tener al menos 32 caracteres (256 bits) porque se firma con HS256.
app.jwt.secret=${JWT_SECRET:cambiar-esta-clave-en-produccion-campus-tech-2026}
# Cuanto dura el token, en milisegundos. 86400000 = 24 horas.
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
