# Perfil de prueba local sin MySQL: mvnw spring-boot:run -Dspring-boot.run.profiles=h2
# La base queda en un archivo (target/h2/ecommerce.mv.db) para poder inspeccionarla despues.
spring.datasource.url=jdbc:h2:file:./target/h2/ecommerce;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
